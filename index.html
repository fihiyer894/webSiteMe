<style>
:root{--bg:#0A0A0C;--card:#121316;--line:#22242A;--tx:#F2F3F5;--mut:#8D919B;--blue:#007AFF;--vio:#7C5CFF;--ok:#30D158;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:80px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.65 "Plus Jakarta Sans",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
html{-webkit-text-size-adjust:100%}body{overflow-x:clip}
.wrap{max-width:1160px;margin:0 auto;padding:0 max(24px,env(safe-area-inset-left)) 0 max(24px,env(safe-area-inset-right))}
.burger,.links .mcta{display:none}
.burger .x{display:none}
section{padding:96px 0}
h1,h2,h3{margin:0;letter-spacing:-.025em;line-height:1.12}
h2{font-size:clamp(28px,4vw,40px);font-weight:700}
.lead{color:var(--mut);max-width:62ch;margin:16px 0 0}
/* nav */
header{position:sticky;top:0;z-index:20;background:rgba(10,10,12,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;gap:28px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(0,122,255,.18),0 0 16px var(--blue);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(0,122,255,.06),0 0 22px var(--blue)}}
.links{display:flex;gap:24px;margin-left:12px;font-size:14px;color:var(--mut)}
.links a:hover{color:var(--tx)}
.sp{flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px;font-weight:600}
.lang button{background:none;border:0;color:var(--mut);padding:6px 11px;cursor:pointer;font:inherit}
.lang button[aria-pressed=true]{background:var(--card);color:var(--tx)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:12px 22px;font:600 15px/1 inherit;font-family:inherit;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s}
.btn:hover{transform:translateY(-1px);border-color:#34373f}
.btn.p{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 1px rgba(0,122,255,.4),0 8px 32px -6px rgba(0,122,255,.65)}
.btn.p:hover{box-shadow:0 0 0 1px rgba(0,122,255,.6),0 10px 44px -4px rgba(0,122,255,.9)}
.btn.sm{padding:9px 16px;font-size:14px}
/* hero */
.hero{padding:88px 0 72px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-200px 0 auto;height:560px;background:radial-gradient(ellipse 50% 60% at 70% 30%,rgba(124,92,255,.22),transparent 70%),radial-gradient(ellipse 40% 50% at 30% 20%,rgba(0,122,255,.2),transparent 70%);pointer-events:none}
.hg{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center;position:relative}
h1{font-size:clamp(34px,5.4vw,60px);font-weight:800;letter-spacing:-.035em}
.hero .lead{font-size:18px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.proof{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:36px;color:var(--mut);font-size:14px}
.proof b{color:var(--tx);font-weight:600}
/* chat */
.chat{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px -30px rgba(0,122,255,.35);overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.ch small{color:var(--ok);font-weight:500;margin-left:auto;font-size:12px}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--vio))}
.cb{padding:18px;display:flex;flex-direction:column;gap:10px;min-height:330px;font-size:14px}
.m{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.45;opacity:0;transform:translateY(6px);transition:.35s}
.m.on{opacity:1;transform:none}
.m.u{align-self:flex-end;background:var(--blue);border-bottom-right-radius:4px}
.m.b{background:#1B1D22;border:1px solid var(--line);border-bottom-left-radius:4px}
.m i{display:block;font-style:normal;color:var(--ok);font-size:12px;margin-top:6px}
/* cards */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;transition:border-color .25s,box-shadow .25s}
.card:hover{border-color:rgba(0,122,255,.5);box-shadow:0 0 40px -12px rgba(0,122,255,.5)}
.ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:rgba(0,122,255,.12);color:var(--blue);margin-bottom:20px}
.card h3{font-size:19px;font-weight:700}
.card p{color:var(--mut);font-size:15px;margin:10px 0 18px}
.tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.tags li{font-size:12.5px;color:#B7BBC5;border:1px solid var(--line);border-radius:999px;padding:4px 11px}
/* split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:48px}
.col{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.col.good{border-color:rgba(0,122,255,.45);box-shadow:0 0 60px -20px rgba(0,122,255,.5)}
.col h3{font-size:15px;font-weight:600;color:var(--mut);margin-bottom:18px}
.col.good h3{color:var(--blue)}
.col ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.col li{display:flex;gap:12px;font-size:15px}
.col li::before{content:"✕";color:#FF5F57;font-weight:700}
.col.good li::before{content:"✓";color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
.stats div{border-top:1px solid var(--line);padding-top:16px;color:var(--mut);font-size:14px}
.stats b{display:block;color:var(--tx);font-size:28px;letter-spacing:-.03em}
/* work */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:40px}
.tab{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:10px 16px;font:500 14px inherit;font-family:inherit;cursor:pointer;transition:.2s}
.tab:hover{color:var(--tx)}
.tab[aria-selected=true]{background:var(--card);color:var(--tx);border-color:var(--blue);box-shadow:0 0 24px -8px var(--blue)}
.case{display:grid;grid-template-columns:1.2fr .8fr;gap:36px;margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px}
.case h3{font-size:24px;font-weight:700}
.case p{color:var(--mut);margin:12px 0 20px}
.res{display:grid;gap:18px;align-content:center}
.res div{border-left:2px solid var(--blue);padding-left:16px;color:var(--mut);font-size:14px}
.res b{display:block;color:var(--tx);font-size:26px;letter-spacing:-.03em}
/* process */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:48px;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.step{padding:28px;border-right:1px solid var(--line)}
.step:last-child{border:0}
.step em{font-style:normal;color:var(--blue);font-weight:700;font-size:14px}
.step h3{font-size:18px;margin:10px 0 8px}
.step p{color:var(--mut);font-size:14.5px;margin:0}
/* cta */
.cta{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:56px;display:grid;grid-template-columns:1fr 1fr;gap:48px;position:relative;overflow:hidden}
.cta::before{content:"";position:absolute;inset:auto -10% -60% auto;width:60%;height:100%;background:radial-gradient(closest-side,rgba(124,92,255,.25),transparent);pointer-events:none}
form{display:grid;gap:12px;position:relative}
label{font-size:13px;color:var(--mut);display:grid;gap:6px}
input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--tx);font:inherit;font-size:15px;transition:border-color .2s}
input:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.2)}
textarea{resize:vertical;min-height:90px}
.ok{color:var(--ok);font-size:14px;min-height:20px;margin:0}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--mut);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center}
footer a:hover{color:var(--tx)}
@media(max-width:900px){.hg,.split,.case,.cta{grid-template-columns:1fr}.grid3,.steps{grid-template-columns:1fr}.step{border-right:0;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}.cta{padding:32px 24px}section{padding:64px 0}
 nav{gap:12px}
 .burger{display:grid;place-items:center;width:44px;height:44px;background:none;border:1px solid var(--line);border-radius:10px;color:var(--tx);cursor:pointer}
 header.open .burger .b{display:none}header.open .burger .x{display:block}
 .links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;margin:0;padding:6px max(24px,env(safe-area-inset-left)) 20px;background:rgba(10,10,12,.97);border-bottom:1px solid var(--line);font-size:17px}
 header.open .links{display:flex}
 .links a{padding:16px 0;border-bottom:1px solid var(--line);color:var(--tx)}
 .links .mcta{display:flex;margin-top:16px;border:1px solid var(--blue);padding:14px 22px;font-size:16px;color:#fff}
 .hero{padding:48px 0 40px}.hero .lead{font-size:16.5px}
 .split{margin-top:32px}.grid3,.steps{margin-top:32px}
}
@media(max-width:600px){
 .wrap{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
 section{padding:52px 0}
 nav{height:58px}nav>.btn.sm{display:none}
 .logo{font-size:15px;white-space:nowrap}
 .lang button{padding:11px 13px}
 .btn{min-height:48px}
 .ctas{flex-direction:column}.ctas .btn{width:100%}
 .proof{flex-direction:column;gap:8px;margin-top:28px}
 .cb{min-height:300px;padding:14px}.m{max-width:92%}
 .card,.col,.step{padding:22px}
 .stats{gap:12px}.stats b{font-size:21px}.stats div{font-size:12.5px}
 .tabs{flex-wrap:nowrap;overflow-x:auto;margin:32px -20px 0;padding:0 20px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}
 .tab{flex:none;white-space:nowrap;min-height:44px}
 .case{padding:22px;gap:24px;border-radius:16px}.case h3{font-size:21px}
 .cta{padding:28px 20px;border-radius:18px;gap:32px}
 input,textarea{font-size:16px;padding:14px}
 footer .wrap{flex-direction:column;align-items:flex-start;gap:14px}footer .sp{display:none}footer a{padding:4px 0}
}
@media(max-width:360px){.logo{font-size:14px}.lang button{padding:11px 10px}h1{font-size:30px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.m{opacity:1;transform:none}}
</style>
</head>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let lang="en", tab=0, timers=[];
const store={get(){try{return localStorage.getItem("lang")}catch(e){return null}},set(v){try{localStorage.setItem("lang",v)}catch(e){}}};

function detect(){
  const saved=store.get(); if(saved==="en"||saved==="ua") return saved;
  const langs=(navigator.languages||[navigator.language||""]).map(l=>l.toLowerCase());
  let tz=""; try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||""}catch(e){}
  return (langs.some(l=>l.startsWith("uk"))||/^Europe\/(Kyiv|Kiev|Uzhgorod|Zaporozhye)$/.test(tz))?"ua":"en";
}
function render(){
  const d=T[lang]; document.documentElement.lang=lang==="ua"?"uk":"en";
  $$("[data-i18n]").forEach(e=>e.textContent=d[e.dataset.i18n]);
  $$("[data-list]").forEach(e=>{e.innerHTML="";d[e.dataset.list].split("|").forEach(t=>{const li=document.createElement("li");li.textContent=t;e.append(li)})});
  $$(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("#tabs").innerHTML=[1,2,3].map((n,i)=>`<button class="tab" role="tab" aria-selected="${i===tab}" data-i="${i}">${d["w"+n]}</button>`).join("");
  const n=tab+1,r=d["w"+n+"r"].split("|"),stack=["Telegram Bot API · Stripe · Google Sheets","Telegram · CRM · Calendar","Next.js · Vercel · Telegram"][tab];
  $("#case").innerHTML=`<div><h3>${d["w"+n]}</h3><p>${d["w"+n+"d"]}</p><ul class="tags"><li>${stack.split(" · ").join("</li><li>")}</li></ul></div><div class="res"><div><b>${r[1]}</b>${r[0]}</div><div><b>${r[3]}</b>${r[2]}</div></div>`;
  $("#case").setAttribute("aria-label",d["w"+n]);
  const ct=$("#ct"),en=lang==="en";ct.type=en?"email":"text";ct.autocomplete=en?"email":"tel";ct.placeholder=en?"you@company.com":"@username / +380…";
  runDemo();
}
function runDemo(){
  timers.forEach(clearTimeout); timers=[]; const cb=$("#cb"); cb.innerHTML="";
  DEMO[lang].forEach(([w,t],i)=>{const m=document.createElement("div");m.className="m "+w;m.innerHTML=t;cb.append(m);
    timers.push(setTimeout(()=>m.classList.add("on"),500+i*1300));});
}
document.addEventListener("click",e=>{
  const l=e.target.closest(".lang button"); if(l){lang=l.dataset.l;store.set(lang);render();}
  const t=e.target.closest(".tab"); if(t){tab=+t.dataset.i;const keep=lang;render();}
});
$("#tg").href=$("#tg2").href="https://t.me/"+TG;
$("#y").textContent=new Date().getFullYear();
$("#f").addEventListener("submit",async e=>{
  e.preventDefault(); const f=e.target,d=T[lang],v=Object.fromEntries(new FormData(f));
  if(!v.name.trim()||(lang==="en"?!/^\S+@\S+\.\S+$/.test(v.contact.trim()):v.contact.trim().length<3)||!v.msg.trim()){$("#ok").textContent=d.err;$("#ok").style.color="#FF5F57";return}
  $("#ok").style.color="";
  try{
    let sent=!!v.hp;if(!sent&&TG_TOKEN){try{const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");const text=`📩 <b>Нова заявка — telegrambot.studio</b>\n\n👤 <b>Ім'я:</b> ${esc(v.name.trim())}\n📞 <b>Контакт:</b> ${esc(v.contact.trim())}\n💬 <b>Повідомлення:</b> ${esc(v.msg.trim().slice(0,1000))}\n🌐 ${lang.toUpperCase()}`;const r=await fetch("https://api.telegram.org/bot"+TG_TOKEN+"/sendMessage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:TG_CHAT,text,parse_mode:"HTML"})});sent=(await r.json()).ok}catch(_){}}
    if(!sent)window.open("https://t.me/"+TG+"?text="+encodeURIComponent(`${v.name} (${v.contact}): ${v.msg}`),"_blank","noopener");
    $("#ok").textContent=d.ok; f.reset();
  }catch(x){$("#ok").textContent=d.err;$("#ok").style.color="#FF5F57"}
});
const hd=document.querySelector("header"),bg=$("#bg");
const menu=o=>{hd.classList.toggle("open",o);bg.setAttribute("aria-expanded",o)};
bg.addEventListener("click",()=>menu(!hd.classList.contains("open")));
$("#lk").addEventListener("click",e=>{if(e.target.closest("a"))menu(false)});
addEventListener("keydown",e=>{if(e.key==="Escape")menu(false)});
matchMedia("(min-width:901px)").addEventListener("change",e=>{if(e.matches)menu(false)});
lang=detect(); render();
